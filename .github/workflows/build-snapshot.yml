name: Build Paper 26.2-snapshot-6

on:
  push:
    branches: [ "26.2-snapshot-6" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"

      - name: Apply Patches (with decompiled source extraction)
        id: apply_patches
        run: |
          ./gradlew applyPatches --stacktrace 2>&1 | tee applyPatches.log
        continue-on-error: true

      - name: Check patch result and dump vanilla source
        if: always()
        run: |
          if grep -q "Failed to apply.*mache patches\|BUILD FAILED" applyPatches.log 2>/dev/null; then
            echo "PATCH_STATUS=FAILED" >> $GITHUB_ENV
            echo "=== MACHE PATCH FAILURES ==="
            grep -i "Patching:\|Hunk.*FAILURE\|Failed to apply" applyPatches.log || true
          else
            echo "PATCH_STATUS=SUCCESS" >> $GITHUB_ENV
          fi

          echo ""
          echo "=== LOOKING FOR DECOMPILED SOURCE ==="
          # The decompiled source is extracted by setupMacheSources before patching
          # It should be in paper-server/src/minecraft/java/ or similar
          find paper-server -name "LivingEntity.java" -not -path "*/patches/*" 2>/dev/null | head -5 || true
          find paper-server -name "Climate.java" -not -path "*/patches/*" 2>/dev/null | head -5 || true

          # Also check the Gradle cache for the decompiled jar
          echo ""
          echo "=== MACHE CACHE FILES ==="
          find paper-server/.gradle -name "*.jar" 2>/dev/null | head -10 || true
          find paper-server/build -name "*.jar" -not -path "*/libs/*" 2>/dev/null | head -10 || true

          # Try to find the extracted decompiled source directory
          echo ""
          echo "=== PAPER-SERVER DIR STRUCTURE ==="
          ls -la paper-server/src/ 2>/dev/null || true
          find paper-server/src -maxdepth 3 -type d 2>/dev/null | head -20 || true

      - name: Extract decompiled vanilla source from cache
        if: env.PATCH_STATUS == 'FAILED'
        run: |
          # Find the decompiled jar in Gradle cache
          DECOMPILED_JAR=$(find paper-server/.gradle -name "*.jar" -path "*mache*" 2>/dev/null | head -1)
          if [ -z "$DECOMPILED_JAR" ]; then
            DECOMPILED_JAR=$(find paper-server/.gradle -name "*decompile*" -name "*.jar" 2>/dev/null | head -1)
          fi
          if [ -z "$DECOMPILED_JAR" ]; then
            # Try finding any jar that might contain decompiled source
            DECOMPILED_JAR=$(find paper-server/.gradle -name "sources*.jar" 2>/dev/null | head -1)
          fi

          if [ -n "$DECOMPILED_JAR" ]; then
            echo "Found decompiled jar: $DECOMPILED_JAR"
            mkdir -p /tmp/vanilla-src
            cd /tmp/vanilla-src
            jar xf "$DECOMPILED_JAR" 2>/dev/null || unzip -o "$DECOMPILED_JAR" 2>/dev/null || true
            echo "=== LivingEntity.java around lines 1170-1190 ==="
            LIVING=$(find . -name "LivingEntity.java" -path "*/world/entity/*" 2>/dev/null | head -1)
            if [ -n "$LIVING" ]; then
              sed -n '1160,1200p' "$LIVING" 2>/dev/null || true
              echo ""
              echo "=== Lines 1250-1290 ==="
              sed -n '1250,1290p' "$LIVING" 2>/dev/null || true
              echo ""
              echo "=== HurtByTimestamp search ==="
              grep -n "HurtByTimestamp\|hurtByTimestamp\|ticks_since_last_hurt" "$LIVING" 2>/dev/null || echo "Not found"
              echo ""
              echo "=== Total lines ==="
              wc -l "$LIVING" 2>/dev/null || true
            else
              echo "LivingEntity.java not found in jar"
              find . -name "*.java" -path "*/entity/*" | head -10 || true
            fi
            echo ""
            CLIMATE=$(find . -name "Climate.java" -path "*/biome/*" 2>/dev/null | head -1)
            if [ -n "$CLIMATE" ]; then
              echo "=== Climate.java around lines 255-285 ==="
              sed -n '255,285p' "$CLIMATE" 2>/dev/null || true
            else
              echo "Climate.java not found in jar"
            fi
          else
            echo "No decompiled jar found in cache"
            # Try to extract from the Gradle cache more broadly
            echo "=== All jars in .gradle ==="
            find paper-server/.gradle -name "*.jar" 2>/dev/null | head -20 || true
            echo ""
            echo "=== All .java in mache cache ==="
            find paper-server/.gradle/caches/paperweight/mache -name "*.java" 2>/dev/null | head -10 || true
            echo ""
            echo "=== Mache cache directory listing ==="
            ls -laR paper-server/.gradle/caches/paperweight/mache/ 2>/dev/null | head -50 || true
          fi

      - name: Upload patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applyPatches-log
          path: applyPatches.log
          retention-days: 7

      - name: Compile Java
        if: env.PATCH_STATUS == 'SUCCESS'
        id: compile
        run: |
          ./gradlew :paper-server:compileJava 2>&1 | tee compileJava.log
        continue-on-error: true

      - name: Check compile result
        if: env.PATCH_STATUS == 'SUCCESS'
        run: |
          if grep -q "BUILD FAILED\|error:" compileJava.log 2>/dev/null; then
            echo "COMPILE_STATUS=FAILED" >> $GITHUB_ENV
            echo "=== COMPILE ERROR SUMMARY ==="
            grep "error:" compileJava.log | sort -u | head -200
            echo ""
            echo "=== UNIQUE MISSING PACKAGES ==="
            grep "package .* does not exist" compileJava.log | sed 's/.*package //' | sed 's/ does not exist.*//' | sort -u
            echo ""
            echo "=== FULL ERROR COUNT ==="
            grep -c "error:" compileJava.log || echo "0"
          else
            echo "COMPILE_STATUS=SUCCESS" >> $GITHUB_ENV
          fi

      - name: Upload compile log
        if: always() && env.PATCH_STATUS == 'SUCCESS'
        uses: actions/upload-artifact@v4
        with:
          name: compileJava-log
          path: compileJava.log
          retention-days: 7

      - name: List available Gradle tasks
        if: env.COMPILE_STATUS == 'SUCCESS'
        run: |
          ./gradlew tasks --all 2>&1 | grep -i "bundler\|paperclip\|mojmap\|jar\|shadow\|createMojmap\|createPaperclip" || true

      - name: Build jar
        if: env.COMPILE_STATUS == 'SUCCESS'
        id: build_jar
        run: |
          for task in createMojmapBundlerJar createBundlerJar paperclipJar createPaperclipJar shadowJar; do
            echo "Trying task: $task"
            if ./gradlew $task 2>&1 | tee buildJar.log; then
              echo "BUILD_STATUS=SUCCESS" >> $GITHUB_ENV
              break
            else
              echo "$task failed, trying next..."
            fi
          done
          if [ "${BUILD_STATUS:-FAILED}" != "SUCCESS" ]; then
            echo "BUILD_STATUS=FAILED" >> $GITHUB_ENV
            echo "=== Available jar tasks ==="
            ./gradlew tasks --all 2>&1 | grep -i "jar" | tee -a buildJar.log || true
          fi
        continue-on-error: true

      - name: Upload build log
        if: always() && env.COMPILE_STATUS == 'SUCCESS'
        uses: actions/upload-artifact@v4
        with:
          name: buildJar-log
          path: buildJar.log
          retention-days: 7

      - name: Upload server jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-server-jar
          path: |
            paper-server/build/libs/*.jar
            paper-server/build/libs/*/*.jar
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Patch status: ${PATCH_STATUS:-unknown}" >> $GITHUB_STEP_SUMMARY
          echo "- Compile status: ${COMPILE_STATUS:-skipped}" >> $GITHUB_STEP_SUMMARY
          echo "- Build status: ${BUILD_STATUS:-skipped}" >> $GITHUB_STEP_SUMMARY
