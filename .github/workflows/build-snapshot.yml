name: Build Paper 26.2-snapshot-6

on:
  push:
    branches: [ "26.2-snapshot-6" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
          key: gradle-26.2-snapshot-6-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradlew') }}
          restore-keys: |
            gradle-26.2-snapshot-6-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Apply Patches
        run: |
          ./gradlew applyPatches 2>&1 | tee applyPatches.log
        continue-on-error: true

      - name: Check patch status
        run: |
          if grep -qi "FAIL\|CONFLICT\|error\|could not apply" applyPatches.log; then
            echo "⚠️ Patches failed - listing conflicts"
            echo "=== FAILED PATCHES ==="
            grep -i "FAIL\|CONFLICT\|could not apply\|error:" applyPatches.log || true
            echo "=== CONFLICT FILES ==="
            find . -name "*.java" -exec grep -l "<<<<<<< HEAD" {} \; 2>/dev/null || true
            echo "PATCH_STATUS=FAILED" >> $GITHUB_ENV
          else
            echo "✅ Patches applied successfully"
            echo "PATCH_STATUS=SUCCESS" >> $GITHUB_ENV
          fi

      - name: Upload patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applyPatches-log
          path: applyPatches.log
          retention-days: 7

      - name: Compile (if patches succeeded)
        if: env.PATCH_STATUS == 'SUCCESS'
        run: |
          ./gradlew :paper-server:compileJava 2>&1 | tee compileJava.log
        continue-on-error: true

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compileJava-log
          path: compileJava.log
          retention-days: 7

      - name: Build bundler jar (if compile succeeded)
        if: env.PATCH_STATUS == 'SUCCESS'
        run: |
          ./gradlew createMojmapBundlerJar 2>&1 | tee buildJar.log
        continue-on-error: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildJar-log
          path: buildJar.log
          retention-days: 7

      - name: Upload server jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-server-jar
          path: paper-server/build/libs/*.jar
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Patch status: ${{ env.PATCH_STATUS }}" >> $GITHUB_STEP_SUMMARY
          if [ -f compileJava.log ]; then
            if grep -qi "error\|FAIL" compileJava.log; then
              echo "- Compile status: FAILED" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Compile status: SUCCESS" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          if [ -f buildJar.log ]; then
            if grep -qi "error\|FAIL" buildJar.log; then
              echo "- Build status: FAILED" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Build status: SUCCESS" >> $GITHUB_STEP_SUMMARY
            fi
          fi
