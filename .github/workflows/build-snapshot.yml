name: Build Paper 26.2-snapshot-6

on:
  push:
    branches: [ "26.2-snapshot-6" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"

      - name: Apply Patches
        id: apply_patches
        run: |
          ./gradlew applyPatches --stacktrace 2>&1 | tee applyPatches.log
        continue-on-error: true

      - name: Check patch result and dump decompiled source
        if: always()
        run: |
          if grep -q "Failed to apply.*mache patches\|BUILD FAILED" applyPatches.log 2>/dev/null; then
            echo "PATCH_STATUS=FAILED" >> $GITHUB_ENV
            echo "=== MACHE PATCH FAILURES ==="
            grep -i "Patching:\|Hunk.*FAILURE\|Failed to apply" applyPatches.log || true
          else
            echo "PATCH_STATUS=SUCCESS" >> $GITHUB_ENV
          fi

          echo ""
          echo "=== SEARCHING FOR DECOMPILED MACHE SOURCE ==="
          # The decompiled source is in the mache cache
          # Multiple possible locations:
          # 1. paper-server/.gradle/caches/paperweight/mache/base/sources/ (current version)
          # 2. paper-server/src/minecraft/java/ (after successful setupMacheSources)
          # 3. Various task output directories

          echo "--- mache base sources ---"
          find paper-server/.gradle/caches/paperweight/mache -name "*.java" -not -path "*/oldPaper/*" 2>/dev/null | head -5 || true

          echo "--- mache decompile output ---"
          find paper-server/build -name "*.java" -not -path "*/oldPaper/*" 2>/dev/null | head -5 || true

          echo "--- paperweight task cache ---"
          find paper-server/.gradle/caches/paperweight -maxdepth 5 -type d -name "sources" -not -path "*/oldPaper/*" 2>/dev/null | head -10 || true

          echo "--- All .java in mache cache (not oldPaper) ---"
          find paper-server/.gradle/caches/paperweight/mache -name "LivingEntity.java" -not -path "*/oldPaper/*" 2>/dev/null || true

          echo "--- Decompile task output ---"
          find paper-server/build/tmp -name "*.java" 2>/dev/null | head -5 || true
          find paper-server/build/mache -name "*.java" 2>/dev/null | head -5 || true

          # Also check the Gradle user home cache
          echo "--- Gradle user home mache cache ---"
          find /home/runner/.gradle/caches -name "LivingEntity.java" -not -path "*/oldPaper/*" 2>/dev/null | head -5 || true

          # Try to extract from the decompiled jar in the taskCache
          echo ""
          echo "=== EXTRACTING FROM DECOMPILE JAR ==="
          DECOMPILE_JAR=$(find paper-server/.gradle/caches/paperweight -name "decompileJar.jar" -not -path "*/oldPaper/*" 2>/dev/null | head -1)
          if [ -n "$DECOMPILE_JAR" ]; then
            echo "Found decompile jar: $DECOMPILE_JAR"
            mkdir -p /tmp/vanilla-src
            cd /tmp/vanilla-src
            jar xf "$GITHUB_WORKSPACE/$DECOMPILE_JAR" 2>/dev/null || true
            LIVING=$(find . -name "LivingEntity.java" -path "*/world/entity/*" 2>/dev/null | head -1)
            if [ -n "$LIVING" ]; then
              echo "=== 26.2 LivingEntity.java lines 1160-1200 (around hunk 1176) ==="
              sed -n '1160,1200p' "$LIVING" || true
              echo ""
              echo "=== 26.2 LivingEntity.java lines 1250-1290 (around hunk 1268) ==="
              sed -n '1250,1290p' "$LIVING" || true
            else
              echo "LivingEntity.java not found in decompile jar"
            fi
            CLIMATE=$(find . -name "Climate.java" -path "*/biome/*" 2>/dev/null | head -1)
            if [ -n "$CLIMATE" ]; then
              echo "=== 26.2 Climate.java lines 260-280 (around hunk 268) ==="
              sed -n '260,280p' "$CLIMATE" || true
            fi
          else
            echo "No decompile jar found"
            # Try listing all paperweight cache dirs
            echo "--- paperweight cache directory tree ---"
            find paper-server/.gradle/caches/paperweight -maxdepth 3 -type d -not -path "*/oldPaper/*" 2>/dev/null | head -30 || true
          fi

      - name: Upload patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applyPatches-log
          path: applyPatches.log
          retention-days: 7

      - name: Compile Java
        if: env.PATCH_STATUS == 'SUCCESS'
        id: compile
        run: |
          ./gradlew :paper-server:compileJava 2>&1 | tee compileJava.log
        continue-on-error: true

      - name: Check compile result
        if: env.PATCH_STATUS == 'SUCCESS'
        run: |
          if grep -q "BUILD FAILED\|error:" compileJava.log 2>/dev/null; then
            echo "COMPILE_STATUS=FAILED" >> $GITHUB_ENV
            echo "=== COMPILE ERROR SUMMARY ==="
            grep "error:" compileJava.log | sort -u | head -200
            echo ""
            echo "=== UNIQUE MISSING PACKAGES ==="
            grep "package .* does not exist" compileJava.log | sed 's/.*package //' | sed 's/ does not exist.*//' | sort -u
            echo ""
            echo "=== FULL ERROR COUNT ==="
            grep -c "error:" compileJava.log || echo "0"
          else
            echo "COMPILE_STATUS=SUCCESS" >> $GITHUB_ENV
          fi

      - name: Upload compile log
        if: always() && env.PATCH_STATUS == 'SUCCESS'
        uses: actions/upload-artifact@v4
        with:
          name: compileJava-log
          path: compileJava.log
          retention-days: 7

      - name: List available Gradle tasks
        if: env.COMPILE_STATUS == 'SUCCESS'
        run: |
          ./gradlew tasks --all 2>&1 | grep -i "bundler\|paperclip\|mojmap\|jar\|shadow\|createMojmap\|createPaperclip" || true

      - name: Build jar
        if: env.COMPILE_STATUS == 'SUCCESS'
        id: build_jar
        run: |
          for task in createMojmapBundlerJar createBundlerJar paperclipJar createPaperclipJar shadowJar; do
            echo "Trying task: $task"
            if ./gradlew $task 2>&1 | tee buildJar.log; then
              echo "BUILD_STATUS=SUCCESS" >> $GITHUB_ENV
              break
            else
              echo "$task failed, trying next..."
            fi
          done
          if [ "${BUILD_STATUS:-FAILED}" != "SUCCESS" ]; then
            echo "BUILD_STATUS=FAILED" >> $GITHUB_ENV
            echo "=== Available jar tasks ==="
            ./gradlew tasks --all 2>&1 | grep -i "jar" | tee -a buildJar.log || true
          fi
        continue-on-error: true

      - name: Upload build log
        if: always() && env.COMPILE_STATUS == 'SUCCESS'
        uses: actions/upload-artifact@v4
        with:
          name: buildJar-log
          path: buildJar.log
          retention-days: 7

      - name: Upload server jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-server-jar
          path: |
            paper-server/build/libs/*.jar
            paper-server/build/libs/*/*.jar
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Patch status: ${PATCH_STATUS:-unknown}" >> $GITHUB_STEP_SUMMARY
          echo "- Compile status: ${COMPILE_STATUS:-skipped}" >> $GITHUB_STEP_SUMMARY
          echo "- Build status: ${BUILD_STATUS:-skipped}" >> $GITHUB_STEP_SUMMARY
