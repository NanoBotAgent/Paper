name: Build Paper 26.2-snapshot-6

on:
  push:
    branches: [ "26.2-snapshot-6" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"

      # The mache 26.2-snapshot-6+build.1 patches fail due to line number offset.
      # Disable mache so setupMacheSources skips mache patch application,
      # then we'll apply the fixes manually via sed after decompile.
      - name: Disable broken mache patches
        run: |
          cd paper-server
          # Comment out the mache dependency line
          sed -i 's|mache("io.papermc:mache:.*")|// mache disabled - patches have wrong line numbers|' build.gradle.kts
          echo "=== Modified mache line ==="
          grep -n "mache\|disabled" build.gradle.kts

      - name: Apply Patches (without mache patches)
        id: apply_patches
        run: |
          ./gradlew applyPatches --stacktrace 2>&1 | tee applyPatches.log
        continue-on-error: true

      - name: Check patch result
        if: always()
        run: |
          if grep -q "Failed to apply.*mache patches\|BUILD FAILED" applyPatches.log 2>/dev/null; then
            echo "PATCH_STATUS=FAILED" >> $GITHUB_ENV
            echo "=== MACHE PATCH FAILURES ==="
            grep -i "Patching:\|Hunk.*FAILURE\|Failed to apply" applyPatches.log || true
          else
            echo "PATCH_STATUS=SUCCESS" >> $GITHUB_ENV
            echo "=== Patch succeeded ==="
          fi

      # Apply the 3 mache fixes manually via sed on the decompiled source
      - name: Apply mache fixes manually
        if: env.PATCH_STATUS == 'SUCCESS'
        run: |
          echo "=== Applying mache fixes manually ==="
          
          # Fix 1: LivingEntity.java - add float originalDamage = damage;
          LIVING=$(find paper-server/src/minecraft/java -name "LivingEntity.java" -path "*/world/entity/*" 2>/dev/null | head -1)
          if [ -n "$LIVING" ]; then
            echo "Found LivingEntity.java at: $LIVING"
            echo "Fix 1: add originalDamage variable before itemInUse"
            sed -i '/ItemStack itemInUse = this.getUseItem();/i\        float originalDamage = damage;' "$LIVING"
            
            # Fix 2: LivingEntity.java - replace damage,damage with originalDamage,damage in CriteriaTriggers
            echo "Fix 2: replace damage,damage with originalDamage,damage in CriteriaTriggers"
            sed -i 's/CriteriaTriggers\.ENTITY_HURT_PLAYER\.trigger(serverPlayer, source, damage, damage, blocked)/CriteriaTriggers.ENTITY_HURT_PLAYER.trigger(serverPlayer, source, originalDamage, damage, blocked)/' "$LIVING"
            sed -i 's/CriteriaTriggers\.PLAYER_HURT_ENTITY\.trigger(sourcePlayer, this, source, damage, damage, blocked)/CriteriaTriggers.PLAYER_HURT_ENTITY.trigger(sourcePlayer, this, source, originalDamage, damage, blocked)/' "$LIVING"
            
            echo "=== Verify fixes ==="
            grep -n "originalDamage" "$LIVING"
          else
            echo "ERROR: LivingEntity.java not found in decompiled source"
            find paper-server/src -name "LivingEntity.java" 2>/dev/null | head -5
          fi
          
          # Fix 3: Climate.java - add diamond operator to RTree.Leaf constructor
          CLIMATE=$(find paper-server/src/minecraft/java -name "Climate.java" -path "*/biome/*" 2>/dev/null | head -1)
          if [ -n "$CLIMATE" ]; then
            echo "Found Climate.java at: $CLIMATE"
            echo "Fix 3: add diamond operator to RTree.Leaf"
            sed -i 's/new Climate\.RTree\.Leaf(p\.getFirst(), p\.getSecond())/new Climate.RTree.Leaf<>(p.getFirst(), p.getSecond())/' "$CLIMATE"
            
            echo "=== Verify fix ==="
            grep -n "RTree.Leaf<>" "$CLIMATE"
          else
            echo "ERROR: Climate.java not found in decompiled source"
            find paper-server/src -name "Climate.java" 2>/dev/null | head -5
          fi

      - name: Upload patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applyPatches-log
          path: applyPatches.log
          retention-days: 7

      # Step 3: Compile with manual mache fixes applied
      - name: Compile Java
        if: env.PATCH_STATUS == 'SUCCESS'
        id: compile
        run: |
          ./gradlew :paper-server:compileJava 2>&1 | tee compileJava.log
        continue-on-error: true

      - name: Check compile result
        if: env.PATCH_STATUS == 'SUCCESS'
        run: |
          if grep -q "BUILD FAILED\|error:" compileJava.log 2>/dev/null; then
            echo "COMPILE_STATUS=FAILED" >> $GITHUB_ENV
            echo "=== COMPILE ERROR SUMMARY ==="
            grep "error:" compileJava.log | sort -u | head -200
            echo ""
            echo "=== UNIQUE MISSING PACKAGES ==="
            grep "package .* does not exist" compileJava.log | sed 's/.*package //' | sed 's/ does not exist.*//' | sort -u
            echo ""
            echo "=== FULL ERROR COUNT ==="
            grep -c "error:" compileJava.log || echo "0"
          else
            echo "COMPILE_STATUS=SUCCESS" >> $GITHUB_ENV
          fi

      - name: Upload compile log
        if: always() && env.PATCH_STATUS == 'SUCCESS'
        uses: actions/upload-artifact@v4
        with:
          name: compileJava-log
          path: compileJava.log
          retention-days: 7

      - name: List available Gradle tasks
        if: env.COMPILE_STATUS == 'SUCCESS'
        run: |
          ./gradlew tasks --all 2>&1 | grep -i "bundler\|paperclip\|mojmap\|jar\|shadow\|createMojmap\|createPaperclip" || true

      - name: Build jar
        if: env.COMPILE_STATUS == 'SUCCESS'
        id: build_jar
        run: |
          for task in createMojmapBundlerJar createBundlerJar paperclipJar createPaperclipJar shadowJar; do
            echo "Trying task: $task"
            if ./gradlew $task 2>&1 | tee buildJar.log; then
              echo "BUILD_STATUS=SUCCESS" >> $GITHUB_ENV
              break
            else
              echo "$task failed, trying next..."
            fi
          done
          if [ "${BUILD_STATUS:-FAILED}" != "SUCCESS" ]; then
            echo "BUILD_STATUS=FAILED" >> $GITHUB_ENV
            echo "=== Available jar tasks ==="
            ./gradlew tasks --all 2>&1 | grep -i "jar" | tee -a buildJar.log || true
          fi
        continue-on-error: true

      - name: Upload build log
        if: always() && env.COMPILE_STATUS == 'SUCCESS'
        uses: actions/upload-artifact@v4
        with:
          name: buildJar-log
          path: buildJar.log
          retention-days: 7

      - name: Upload server jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-server-jar
          path: |
            paper-server/build/libs/*.jar
            paper-server/build/libs/*/*.jar
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Patch status: ${PATCH_STATUS:-unknown}" >> $GITHUB_STEP_SUMMARY
          echo "- Compile status: ${COMPILE_STATUS:-skipped}" >> $GITHUB_STEP_SUMMARY
          echo "- Build status: ${BUILD_STATUS:-skipped}" >> $GITHUB_STEP_SUMMARY
