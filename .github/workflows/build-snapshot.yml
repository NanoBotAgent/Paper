name: Build Paper 26.2-snapshot-6

on:
  push:
    branches: [ "26.2-snapshot-6" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Apply Patches
        id: apply_patches
        run: |
          set +e
          ./gradlew applyPatches 2>&1 | tee applyPatches.log
          PATCH_EXIT=$?
          set -e
          echo "patch_exit_code=$PATCH_EXIT" >> $GITHUB_OUTPUT
          if [ $PATCH_EXIT -ne 0 ]; then
            echo "PATCH_STATUS=FAILED" >> $GITHUB_ENV
            echo "⚠️ Patches failed (exit code $PATCH_EXIT)"
          else
            echo "PATCH_STATUS=SUCCESS" >> $GITHUB_ENV
            echo "✅ Patches applied successfully"
          fi

      - name: List failed patches
        if: env.PATCH_STATUS == 'FAILED'
        run: |
          echo "=== FAILED PATCHES ==="
          grep -i "FAIL\|CONFLICT\|could not apply\|error:" applyPatches.log || true
          echo ""
          echo "=== CONFLICT FILES ==="
          find . -name "*.java" -exec grep -l "<<<<<<< HEAD" {} \; 2>/dev/null || true
          echo ""
          echo "=== LAST 200 LINES ==="
          tail -200 applyPatches.log

      - name: Upload patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applyPatches-log
          path: applyPatches.log
          retention-days: 7

      - name: Compile Java
        if: env.PATCH_STATUS == 'SUCCESS'
        id: compile
        run: |
          set +e
          ./gradlew :paper-server:compileJava 2>&1 | tee compileJava.log
          COMPILE_EXIT=$?
          set -e
          if [ $COMPILE_EXIT -ne 0 ]; then
            echo "COMPILE_STATUS=FAILED" >> $GITHUB_ENV
          else
            echo "COMPILE_STATUS=SUCCESS" >> $GITHUB_ENV
          fi

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compileJava-log
          path: compileJava.log
          retention-days: 7

      - name: Build bundler jar
        if: env.COMPILE_STATUS == 'SUCCESS'
        id: build_jar
        run: |
          set +e
          ./gradlew createMojmapBundlerJar 2>&1 | tee buildJar.log
          BUILD_EXIT=$?
          set -e
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "BUILD_STATUS=FAILED" >> $GITHUB_ENV
          else
            echo "BUILD_STATUS=SUCCESS" >> $GITHUB_ENV
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildJar-log
          path: buildJar.log
          retention-days: 7

      - name: Upload server jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-server-jar
          path: paper-server/build/libs/*.jar
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Patch status: ${PATCH_STATUS:-unknown}" >> $GITHUB_STEP_SUMMARY
          echo "- Compile status: ${COMPILE_STATUS:-skipped}" >> $GITHUB_STEP_SUMMARY
          echo "- Build status: ${BUILD_STATUS:-skipped}" >> $GITHUB_STEP_SUMMARY
